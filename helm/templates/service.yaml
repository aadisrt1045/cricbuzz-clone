apiVersion: v1
kind: Service
metadata:
  name: {{ include "cricbuzz-clone.fullname" . }}
  labels:
    app: {{ include "cricbuzz-clone.name" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "cricbuzz-clone.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
