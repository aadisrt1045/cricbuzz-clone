replicaCount: 1

image:
  repository: adityamshr2324/cricbuzz-clone
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Or "classic"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

ingress:
  enabled: false

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
